
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>My To-Do List</h1>
            <p>Organize your day, one task at a time.</p>
        </header>

        <main class="todo-card">

            <form id="todo-form">
                <input
                    type="text"
                    id="task-input"
                    placeholder="Enter your task..."
                    maxlength="150"
                    autocomplete="off"
                    required
                >
                <button type="submit" id="add-btn">Add Task</button>
            </form>

            <div class="task-info">
                <span id="task-count">0 tasks remaining</span>
                <span id="total-count">Total: 0</span>
            </div>

            <div class="filters">
                <button class="filter active" data-filter="all">
                    All
                </button>

                <button class="filter" data-filter="active">
                    Active
                </button>

                <button class="filter" data-filter="completed">
                    Completed
                </button>
            </div>

            <ul id="task-list"></ul>

            <div id="empty-message">
                <h3>No tasks found!</h3>
                <p>Add a new task to get started.</p>
            </div>

            <div class="bottom-actions">
                <button id="clear-completed">
                    Clear Completed
                </button>
            </div>

        </main>

        <footer>
            <p>Made with HTML, CSS & JavaScript</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
